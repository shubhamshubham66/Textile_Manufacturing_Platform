# Render Blueprint: FastAPI backend + free PostgreSQL.
# Render dashboard -> New -> Blueprint -> pick this repo. See DEPLOY.md.

databases:
  - name: everest-textile-db
    plan: free
    databaseName: textile
    user: textile

services:
  - type: web
    name: everest-textile-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # On start the API creates tables. Demo data loads only if SEED_IF_EMPTY=true.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: everest-textile-db
          property: connectionString
      # Set this ONCE in the Render dashboard to a long random string and leave
      # it. Do NOT use generateValue here: Render regenerates it on blueprint
      # syncs, which silently invalidates every logged-in user's token (login
      # then fails with "Not authenticated" 401). A fixed secret keeps sessions
      # valid across deploys.
      - key: JWT_SECRET
        sync: false
      # Your Vercel URL(s), comma-separated. Only needed if the browser calls the
      # API directly; the default setup proxies /api through Vercel instead.
      - key: CORS_ORIGINS
        sync: false
      # Real owner login (Gmail + password); created/updated on every start.
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: OWNER_NAME
        sync: false
      # Signup email OTP via Brevo (HTTP API; Render blocks SMTP).
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM_EMAIL
        sync: false
      # AI assistant (server-side only). Leave empty until the Dify app is ready.
      - key: DIFY_API_KEY
        sync: false
      - key: DIFY_BASE_URL
        value: https://api.dify.ai/v1
